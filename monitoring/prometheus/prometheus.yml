global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'analytics-manager'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # Scrape targets:
      # - 'host.docker.internal:8080' when Prometheus runs in Docker on Windows host
      # - '10.0.2.2:8080' when Prometheus runs inside VirtualBox Ubuntu VM
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'analytics-manager'
          env: 'development'
